<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="ltr">

        {{- partial "head.html" . -}}
    </head>
    <body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
        {{- partial "header.html" . -}}

            {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . -}}
    </body>
</html>
