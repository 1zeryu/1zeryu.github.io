<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="ltr">
    <head>
        {{- partial "head.html" . -}}
    </head>
    <body class="kind-{{ .Kind }}{{ with .Type }} section-{{ . }}{{ end }}{{ if .Params.wide }} page-wide{{ end }}">
        {{- partial "header.html" . -}}
        <main class="container">
            {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . -}}
        {{- if .IsPage }}{{- partial "lightbox.html" . -}}{{- end }}
    </body>
</html>
