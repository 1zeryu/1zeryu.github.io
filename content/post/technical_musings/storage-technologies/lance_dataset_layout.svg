<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>

  <text x="30" y="38" font-size="20" font-weight="bold" fill="#0f172a">Lance 数据集：文件层与表层</text>
  <text x="30" y="62" font-size="11" fill="#64748b">文件负责“怎么存”，manifest 负责“这一版包含哪些文件”</text>

  <!-- ================= 左侧：文件格式层 ================= -->
  <rect x="24" y="86" width="440" height="472" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="48" cy="113" r="11" fill="#0f172a"/>
  <text x="48" y="117" font-size="11" fill="#ffffff" text-anchor="middle">0</text>
  <text x="68" y="118" font-size="14" font-weight="bold" fill="#0f172a">文件格式层：列内分页</text>

  <rect x="46" y="142" width="396" height="340" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="58" y="163" font-size="11" fill="#334155">robot.lance（单个数据文件）</text>

  <!-- 四列的页 -->
  <text x="100" y="183" font-size="10" fill="#334155" text-anchor="middle">frame_id</text>
  <text x="196" y="183" font-size="10" fill="#334155" text-anchor="middle">action</text>
  <text x="292" y="183" font-size="10" fill="#334155" text-anchor="middle">camera_video</text>
  <text x="388" y="183" font-size="10" fill="#334155" text-anchor="middle">embedding</text>

  <g fill="#dbeafe" stroke="#3b82f6" stroke-width="1.1">
    <rect x="58" y="192" width="84" height="52" rx="3"/>
    <rect x="58" y="252" width="84" height="52" rx="3"/>
    <rect x="58" y="312" width="84" height="52" rx="3"/>

    <rect x="154" y="192" width="84" height="80" rx="3"/>
    <rect x="154" y="280" width="84" height="80" rx="3"/>

    <rect x="250" y="192" width="84" height="80" rx="3"/>
    <rect x="250" y="280" width="84" height="80" rx="3"/>

    <rect x="346" y="192" width="84" height="38" rx="3"/>
    <rect x="346" y="238" width="84" height="38" rx="3"/>
    <rect x="346" y="284" width="84" height="38" rx="3"/>
    <rect x="346" y="330" width="84" height="38" rx="3"/>
  </g>
  <g font-size="9" fill="#1d4ed8" text-anchor="middle">
    <text x="100" y="222">page 0</text>
    <text x="100" y="282">page 1</text>
    <text x="100" y="342">page 2</text>

    <text x="196" y="236">page 0</text>
    <text x="196" y="324">page 1</text>

    <text x="292" y="236">page 0</text>
    <text x="292" y="324">page 1</text>

    <text x="388" y="215">page 0</text>
    <text x="388" y="261">page 1</text>
    <text x="388" y="307">page 2</text>
    <text x="388" y="353">page 3</text>
  </g>

  <!-- footer -->
  <rect x="58" y="390" width="372" height="78" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="70" y="410" font-size="9.5" fill="#334155">列元数据：每列一个 protobuf，记录页偏移与编码方式</text>
  <text x="70" y="428" font-size="9.5" fill="#334155">Footer：列元数据偏移、global buffer、版本号、魔数 LANC</text>
  <text x="70" y="446" font-size="9.5" fill="#334155">读取顺序：footer → 列元数据 → 目标页 → 字节区间</text>

  <text x="46" y="506" font-size="10" fill="#475569">• 没有 row group，每列的页数可以不同</text>
  <text x="46" y="524" font-size="10" fill="#475569">• 页通常约 8MB，元数据记录每页第一行的行号</text>
  <text x="46" y="542" font-size="10" fill="#475569">• 取任意行范围只需定位对应页，随机读取放大更小</text>

  <!-- ================= 右侧：表格式层 ================= -->
  <rect x="488" y="86" width="448" height="472" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="512" cy="113" r="11" fill="#0f172a"/>
  <text x="512" y="117" font-size="11" fill="#ffffff" text-anchor="middle">1</text>
  <text x="532" y="118" font-size="14" font-weight="bold" fill="#0f172a">表格式层：manifest 与 fragment</text>

  <rect x="506" y="136" width="412" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="520" y="158" font-size="11.5" font-weight="bold" fill="#92400e">Manifest v3（不可变快照）</text>
  <text x="520" y="180" font-size="10" fill="#78350f">• 完整 schema（含嵌套字段）</text>
  <text x="520" y="198" font-size="10" fill="#78350f">• 本版本包含的 fragment 列表</text>
  <text x="520" y="216" font-size="10" fill="#78350f">• 索引元数据（向量 / 标量 / 全文）</text>

  <line x1="712" y1="236" x2="712" y2="256" stroke="#475569" stroke-width="1.5"/>
  <path d="M707,253 L712,259 L717,253" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Fragment 0 -->
  <rect x="506" y="260" width="124" height="166" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="568" y="280" font-size="10.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">Fragment 0</text>
  <g fill="#ede9fe" stroke="#8b5cf6" stroke-width="1">
    <rect x="516" y="290" width="104" height="24" rx="3"/>
    <rect x="516" y="320" width="104" height="24" rx="3"/>
    <rect x="516" y="350" width="104" height="24" rx="3"/>
  </g>
  <g font-size="9" fill="#4c1d95" text-anchor="middle">
    <text x="568" y="306">data file（列 a）</text>
    <text x="568" y="336">data file（列 b）</text>
    <text x="568" y="366">data file（列 c）</text>
  </g>
  <rect x="516" y="382" width="104" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="568" y="400" font-size="9" fill="#991b1b" text-anchor="middle">删除向量</text>

  <!-- Fragment 1 -->
  <rect x="650" y="260" width="124" height="166" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="712" y="280" font-size="10.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">Fragment 1</text>
  <g fill="#ede9fe" stroke="#8b5cf6" stroke-width="1">
    <rect x="660" y="290" width="104" height="24" rx="3"/>
    <rect x="660" y="320" width="104" height="24" rx="3"/>
    <rect x="660" y="350" width="104" height="24" rx="3"/>
  </g>
  <g font-size="9" fill="#4c1d95" text-anchor="middle">
    <text x="712" y="306">data file（列 a）</text>
    <text x="712" y="336">data file（列 b）</text>
    <text x="712" y="366">data file（列 c）</text>
  </g>
  <text x="712" y="400" font-size="9" fill="#94a3b8" text-anchor="middle">无删除</text>

  <!-- Fragment 2 -->
  <rect x="794" y="260" width="124" height="166" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="856" y="280" font-size="10.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">Fragment 2</text>
  <g fill="#ede9fe" stroke="#8b5cf6" stroke-width="1">
    <rect x="804" y="290" width="104" height="24" rx="3"/>
    <rect x="804" y="320" width="104" height="24" rx="3"/>
    <rect x="804" y="350" width="104" height="24" rx="3"/>
  </g>
  <g font-size="9" fill="#4c1d95" text-anchor="middle">
    <text x="856" y="306">data file（列 a）</text>
    <text x="856" y="336">data file（列 b）</text>
    <text x="856" y="366">data file（列 c）</text>
  </g>
  <rect x="804" y="382" width="104" height="28" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="856" y="400" font-size="9" fill="#166534" text-anchor="middle">新增列 d（回填）</text>

  <text x="506" y="450" font-size="10" fill="#475569">新增列 = 给每个 fragment 追加一个数据文件，旧文件不变</text>

  <!-- 版本链 -->
  <rect x="506" y="472" width="64" height="34" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/>
  <text x="538" y="493" font-size="10" fill="#334155" text-anchor="middle">v1</text>
  <line x1="574" y1="489" x2="596" y2="489" stroke="#64748b" stroke-width="1.3"/>
  <path d="M593,485 L598,489 L593,493" fill="none" stroke="#64748b" stroke-width="1.3"/>

  <rect x="602" y="472" width="64" height="34" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/>
  <text x="634" y="493" font-size="10" fill="#334155" text-anchor="middle">v2</text>
  <line x1="670" y1="489" x2="692" y2="489" stroke="#64748b" stroke-width="1.3"/>
  <path d="M689,485 L694,489 L689,493" fill="none" stroke="#64748b" stroke-width="1.3"/>

  <rect x="698" y="472" width="88" height="34" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="742" y="493" font-size="10" fill="#075985" text-anchor="middle">v3（当前）</text>

  <text x="506" y="530" font-size="10" fill="#475569">每个版本都指向自己的 manifest；tag / branch 同样只是引用</text>
</svg>
