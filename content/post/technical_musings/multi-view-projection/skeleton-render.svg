<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" fill="#111827" font-weight="bold">从一条关节角时序，到一段骨架视频</text>

  <!-- 六个方框 -->
  <g font-size="12">
    <rect x="24" y="88" width="128" height="62" rx="8" fill="#e8f1fb" stroke="#1b6ca8" stroke-width="2"/>
    <text x="88" y="114" text-anchor="middle" fill="#0f4a75">关节角</text>
    <text x="88" y="132" text-anchor="middle" fill="#5b7b97" font-size="10">6 关节 + 夹爪</text>

    <rect x="172" y="88" width="128" height="62" rx="8" fill="#eef2f7" stroke="#33415c" stroke-width="2"/>
    <text x="236" y="114" text-anchor="middle" fill="#33415c">正向运动学</text>
    <text x="236" y="132" text-anchor="middle" fill="#6b7684" font-size="10">MJCF / URDF</text>

    <rect x="320" y="88" width="128" height="62" rx="8" fill="#eef2f7" stroke="#33415c" stroke-width="2"/>
    <text x="384" y="114" text-anchor="middle" fill="#33415c">3D 骨架点</text>
    <text x="384" y="132" text-anchor="middle" fill="#6b7684" font-size="10">每臂 9 个 body</text>

    <rect x="468" y="88" width="128" height="62" rx="8" fill="#fdf6e8" stroke="#a8761b" stroke-width="2"/>
    <text x="532" y="114" text-anchor="middle" fill="#7a5410">投影</text>
    <text x="532" y="132" text-anchor="middle" fill="#a8761b" font-size="10">K 缩放 × 外参</text>

    <rect x="616" y="88" width="128" height="62" rx="8" fill="#eef2f7" stroke="#33415c" stroke-width="2"/>
    <text x="680" y="114" text-anchor="middle" fill="#33415c">折线 + 末端球</text>
    <text x="680" y="132" text-anchor="middle" fill="#6b7684" font-size="10">按父子关系连边</text>

    <rect x="764" y="88" width="112" height="62" rx="8" fill="#fdecef" stroke="#d7263d" stroke-width="2"/>
    <text x="820" y="114" text-anchor="middle" fill="#a51a2c">视频</text>
    <text x="820" y="132" text-anchor="middle" fill="#c2556a" font-size="10">skeleton / overlay</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#4b5563" stroke-width="2.5" fill="#4b5563">
    <line x1="153" y1="119" x2="164" y2="119"/><polygon points="171,119 162,114 162,124"/>
    <line x1="301" y1="119" x2="312" y2="119"/><polygon points="319,119 310,114 310,124"/>
    <line x1="449" y1="119" x2="460" y2="119"/><polygon points="467,119 458,114 458,124"/>
    <line x1="597" y1="119" x2="608" y2="119"/><polygon points="615,119 606,114 606,124"/>
    <line x1="745" y1="119" x2="756" y2="119"/><polygon points="763,119 754,114 754,124"/>
  </g>

  <!-- 下方标注 -->
  <g font-size="10" fill="#8a94a6" text-anchor="middle">
    <text x="88" y="168">逐帧对齐时间戳</text>
    <text x="236" y="168">与真机模型一致</text>
    <text x="384" y="168">取链路，非全部 body</text>
    <text x="532" y="168">分辨率变了 K 必须变</text>
    <text x="680" y="168">深度小于 0 要丢弃</text>
    <text x="820" y="168">H.264，逐帧编号</text>
  </g>

  <!-- 三个必须做的检查 -->
  <rect x="24" y="196" width="852" height="120" rx="8" fill="#f7f9fc" stroke="#d5dde7"/>
  <text x="40" y="220" font-size="13" fill="#334155" font-weight="bold">三个最容易漏、且一漏就「看起来像外参错了」的细节</text>
  <text x="40" y="246" font-size="12" fill="#334155">① 内参缩放：640×480 → 192×320 时 sx=0.300、sy=0.667，fx/fy/cx/cy 各按自己的比例改，漏改会整体偏移</text>
  <text x="40" y="268" font-size="12" fill="#334155">② 深度剔除：相机后方的点不能画，也不能给常数惩罚 —— 惩罚项会把位姿往边界推</text>
  <text x="40" y="290" font-size="12" fill="#334155">③ 验收形式：只有把骨架叠回真实画面（overlay）才能验收标定；纯骨架视频看着再漂亮也说明不了对错</text>
</svg>
